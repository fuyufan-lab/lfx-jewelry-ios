name: iOS App Store Upload

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: '上传到 TestFlight'
        required: true
        type: boolean
        default: true

jobs:
  build-and-upload:
    name: Build and Upload to App Store Connect
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm install

      - name: Create www directory
        run: |
          mkdir -p www
          cat > www/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>LFX 珠宝内容</title>
            <script>
              window.location.href = 'https://yh.xiaofenhe.com/lfx-preview/入口页.html';
            </script>
          </head>
          <body>
            <p>加载中...</p>
          </body>
          </html>
          EOF

      - name: Capacitor Sync
        run: npx cap sync ios

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Import Distribution Certificate
        env:
          DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          echo "$DIST_CERT_P12" | base64 -d > /tmp/dist_certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/dist_certificate.p12 -k build.keychain -P "$DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain

      - name: Install Provisioning Profile
        env:
          PROVISIONING_PROFILE: ${{ secrets.IOS_DIST_PROVISIONING_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/lfx_distribution.mobileprovision

      - name: Get Distribution Certificate UUID
        id: cert
        run: |
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain 2>&1)
          echo "--- All identities ---"
          echo "$CERT_INFO"
          
          CERT_UUID=$(echo "$CERT_INFO" | grep -i "Distribution" | head -1 | awk '{print $2}')
          
          if [ -z "$CERT_UUID" ]; then
            echo "Error: No Distribution certificate found"
            exit 1
          fi
          echo "uuid=$CERT_UUID" >> $GITHUB_OUTPUT
          echo "Distribution Certificate UUID: $CERT_UUID"

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install

      - name: Build Archive (Unsigned)
        run: |
          cd ios/App
          echo "Building archive without signing..."
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath /tmp/LFX.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive 2>&1 || {
              echo "Build failed, checking what's wrong..."
              exit 1
            }
          echo "Archive created successfully"
          ls -la /tmp/LFX.xcarchive/Products/Applications/

      - name: Sign Archive with Distribution Certificate
        run: |
          APP_PATH="/tmp/LFX.xcarchive/Products/Applications/App.app"
          CERT_UUID="${{ steps.cert.outputs.uuid }}"
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/lfx_distribution.mobileprovision"
          
          echo "Signing with certificate: $CERT_UUID"
          
          # Copy provisioning profile into app
          cp "$PROFILE_PATH" "$APP_PATH/embedded.mobileprovision"
          
          # Sign frameworks first
          echo "Signing frameworks..."
          find "$APP_PATH" -name "*.framework" -type d -exec codesign --force --sign "$CERT_UUID" --timestamp=none {} \; || true
          
          # Sign the app
          echo "Signing app..."
          codesign --force --sign "$CERT_UUID" --timestamp=none "$APP_PATH" 2>&1 || {
            echo "Manual codesign failed"
            exit 1
          }
          
          echo "Signing complete"

      - name: Create IPA from Signed Archive
        run: |
          echo "Creating IPA from signed archive..."
          mkdir -p /tmp/LFX-export/Payload
          cp -r /tmp/LFX.xcarchive/Products/Applications/App.app /tmp/LFX-export/Payload/
          
          cd /tmp/LFX-export
          zip -r -q LFX-iOS.ipa Payload
          
          echo "✅ IPA created"
          ls -lh LFX-iOS.ipa

      - name: Export IPA for App Store
        run: |
          echo "Skipping xcodebuild export (already signed manually)"
          # IPA already created in previous step

      - name: Upload to App Store Connect
        if: ${{ inputs.upload_to_testflight }}
        continue-on-error: true
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          echo "Uploading to App Store Connect..."
          echo "Apple ID: $APPLE_ID"
          echo "IPA files:"
          ls -lh /tmp/LFX-export/*.ipa
          
          /Applications/Xcode.app/Contents/Developer/usr/bin/altool \
            --upload-app \
            -f /tmp/LFX-export/*.ipa \
            -t ios \
            -u "$APPLE_ID" \
            -p "$APPLE_APP_PASSWORD" 2>&1 || {
              echo "⚠️ Upload failed, but continuing..."
              echo "You can manually upload the IPA from artifacts"
            }
          echo "✅ Upload step complete"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LFX-iOS-AppStore.ipa
          path: /tmp/LFX-export/*.ipa
          retention-days: 30
