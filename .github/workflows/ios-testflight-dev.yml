name: iOS TestFlight Upload (Dev)

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: '上传到 TestFlight'
        required: true
        type: boolean
        default: true

jobs:
  build-and-upload:
    name: Build and Upload with Development Signing
    runs-on: macos-15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm install

      - name: Create www directory
        run: |
          mkdir -p www
          echo '<!DOCTYPE html><html><head><title>LFX</title></head><body><h1>LFX Jewelry</h1></body></html>' > www/index.html

      - name: Capacitor Sync
        run: npx cap sync ios

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install

      - name: Build Archive with Automatic Signing
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath /tmp/LFX.xcarchive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=JMHBJRWXGL \
            -allowProvisioningUpdates \
            archive

      - name: Export IPA
        run: |
          cat > /tmp/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>teamID</key>
              <string>JMHBJRWXGL</string>
          </dict>
          </plist>
          EOF
          
          xcodebuild -exportArchive \
            -archivePath /tmp/LFX.xcarchive \
            -exportPath /tmp/LFX-export \
            -exportOptionsPlist /tmp/ExportOptions.plist

      - name: Upload to App Store Connect
        if: ${{ inputs.upload_to_testflight }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          echo "Uploading IPA..."
          ls -lh /tmp/LFX-export/*.ipa
          
          /Applications/Xcode.app/Contents/Developer/usr/bin/altool \
            --upload-app \
            -f /tmp/LFX-export/*.ipa \
            -t ios \
            -u "$APPLE_ID" \
            -p "$APPLE_APP_PASSWORD" 2>&1 || {
              echo "⚠️ Upload may have failed"
              exit 0
            }

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LFX-iOS-TestFlight.ipa
          path: /tmp/LFX-export/*.ipa
          retention-days: 30
